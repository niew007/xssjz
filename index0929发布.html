<html lang="zh-CN" style="--page-bg: rgba(15, 20, 40, 0.5);"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖星世三角洲行动</title>
<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #00e5ff;
  --primary-glow: #00e5ff66;
  --secondary: #7c4dff;
  --accent: #ff4081;
  --bg-dark: #0a0e1a;
  --page-bg: rgba(15, 20, 40, 0.55);
  --page-edge: rgba(0, 229, 255, 0.15);
  --text-main: #e0e8ff;
  --text-dim: #8899bb;
  --sidebar-w: 320px;
  --book-w: min(1400px, 96vw);
  --page-gap: 60px;
  --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.3s ease;
}

/* ========== 背景层 ========== */
.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background-image: var(--bg-image, url('./bg.webp'));
  background-size: cover; background-position: center; background-repeat: no-repeat;
  transition: background-image 0.8s ease;
}
.bg-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(135deg, rgba(5,8,20,0.55) 0%, rgba(10,14,30,0.45) 50%, rgba(5,8,20,0.55) 100%);
}
.bg-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ========== 书脊与书本容器 ========== */
.book-container {
  position: relative;
  width: var(--book-w);
  max-width: 1600px;
  margin: 40px auto;
  perspective: 2500px;
  z-index: 1;
}
.book-spine {
  position: absolute;
  top: -14px; bottom: -14px;
  left: 50%;
  width: 48px;
  margin-left: -24px;
  background: linear-gradient(90deg,
    rgba(0,0,0,0.45) 0%,
    rgba(30,40,70,0.75) 20%,
    rgba(50,60,100,0.85) 50%,
    rgba(30,40,70,0.75) 80%,
    rgba(0,0,0,0.45) 100%
  );
  border-radius: 5px;
  box-shadow:
    inset 0 0 16px rgba(0,0,0,0.6),
    0 0 28px rgba(0,0,0,0.4);
  z-index: 10;
  transform: translateZ(-2px);
}
.book-spine::before {
  content: '';
  position: absolute;
  top: 14px; bottom: 14px;
  left: 50%; width: 2px; margin-left: -1px;
  background: linear-gradient(180deg, transparent, rgba(0,229,255,0.3), transparent);
}
.spine-decoration {
  position: absolute;
  left: 50%; top: 28px; bottom: 28px;
  width: 1px;
  background: linear-gradient(180deg,
    transparent, rgba(0,229,255,0.4) 10%, rgba(0,229,255,0.4) 90%, transparent);
}

/* ========== 页面区域 ========== */
.pages-wrapper {
  position: relative;
  display: flex;
  align-items: stretch;
  min-height: 760px;
}
.page {
  flex: 1;
  position: relative;
  background: var(--page-bg);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(0, 229, 255, 0.18);
  padding: 56px 52px;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: var(--transition-slow);
}
.page-left {
  border-radius: 12px 0 0 12px;
  border-right: none;
  box-shadow:
    inset -14px 0 40px rgba(0,0,0,0.15),
    -8px 8px 40px rgba(0,0,0,0.25);
  transform-origin: right center;
}
.page-right {
  border-radius: 0 12px 12px 0;
  border-left: none;
  box-shadow:
    inset 14px 0 40px rgba(0,0,0,0.15),
    8px 8px 40px rgba(0,0,0,0.25);
  transform-origin: left center;
}
.page::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 32px,
    rgba(255,255,255,0.006) 32px, rgba(255,255,255,0.006) 33px
  );
  pointer-events: none;
  z-index: 0;
}
.page-left::after {
  content: '';
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.05));
  pointer-events: none;
}
.page-right::after {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(270deg, transparent, rgba(0,229,255,0.05));
  pointer-events: none;
}

/* ========== 翻页动画 ========== */
@keyframes pageFlipLeft {
  0% { transform: rotateY(0deg); opacity: 1; }
  40% { transform: rotateY(-25deg); opacity: 0.7; }
  100% { transform: rotateY(0deg); opacity: 1; }
}
@keyframes pageFlipRight {
  0% { transform: rotateY(0deg); opacity: 1; }
  40% { transform: rotateY(25deg); opacity: 0.7; }
  100% { transform: rotateY(0deg); opacity: 1; }
}
.page.flipping-left { animation: pageFlipLeft 0.7s ease; }
.page.flipping-right { animation: pageFlipRight 0.7s ease; }
.page.flipping-left { box-shadow: -30px 14px 60px rgba(0,0,0,0.4), inset -20px 0 40px rgba(0,0,0,0.15); }
.page.flipping-right { box-shadow: 30px 14px 60px rgba(0,0,0,0.4), inset 20px 0 40px rgba(0,0,0,0.15); }

/* ========== 侧边栏 ========== */
.sidebar {
  position: fixed;
  top: 50%; left: 0;
  transform: translateY(-50%);
  width: var(--sidebar-w);
  background: rgba(10, 14, 30, 0.65);
  backdrop-filter: blur(12px);
  border-right: 1px solid rgba(0,229,255,0.15);
  border-radius: 0 14px 14px 0;
  padding: 30px 0;
  z-index: 100;
  transition: transform var(--transition-slow);
  box-shadow: 4px 0 40px rgba(0,0,0,0.25);
}
.sidebar.collapsed { transform: translateY(-50%) translateX(calc(-1 * var(--sidebar-w) + 40px)); }
.sidebar-toggle {
  position: absolute;
  top: 50%; right: -22px;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  border: 1px solid rgba(0,229,255,0.3);
  background: rgba(0,229,255,0.1);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
  font-size: 20px;
  transition: var(--transition-fast);
  z-index: 101;
}
.sidebar-toggle:hover { background: rgba(0,229,255,0.25); box-shadow: 0 0 20px var(--primary-glow); }
.sidebar.collapsed .sidebar-toggle .arrow { transform: rotate(180deg); }
.arrow { transition: transform var(--transition-fast); display: inline-block; }

.sidebar-title {
  text-align: center;
  font-size: 16px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 26px;
  padding: 0 24px;
}
.sidebar-title span { color: var(--primary); }
.toc-list { list-style: none; padding: 0 16px; }
.toc-item { margin-bottom: 8px; }
.toc-link {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  letter-spacing: 0.5px;
  transition: var(--transition-fast);
  border: 1px solid transparent;
  cursor: pointer;
  background: rgba(0,229,255,0.03);
}
.toc-link:hover {
  color: var(--primary);
  background: rgba(0,229,255,0.08);
  border-color: rgba(0,229,255,0.2);
}
.toc-link.active {
  color: var(--primary);
  background: rgba(0,229,255,0.12);
  border-color: rgba(0,229,255,0.35);
  box-shadow: 0 0 20px rgba(0,229,255,0.1);
}
.toc-num {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
}

/* ========== 章节标题（发光效果） ========== */
.chapter-title {
  font-size: 38px;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  margin-bottom: 12px;
  letter-spacing: 3px;
  text-shadow:
    0 0 12px var(--primary-glow),
    0 0 24px rgba(0,229,255,0.2),
    0 0 48px rgba(0,229,255,0.1);
}
.chapter-subtitle {
  text-align: center;
  font-size: 16px;
  color: var(--text-dim);
  margin-bottom: 36px;
  letter-spacing: 1px;
}
.title-underline {
  width: 100px; height: 3px;
  margin: 0 auto 36px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  box-shadow: 0 0 10px var(--primary-glow);
}

/* ========== 按钮区域 ========== */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  position: relative; z-index: 1;
}
.btn-grid .nav-btn:nth-child(even) { transform: translateX(10px); }
.btn-grid .nav-btn:nth-child(odd) { transform: translateX(-5px); }

.nav-btn {
  position: relative;
  padding: 20px 28px;
  background: rgba(0,229,255,0.06);
  border: 1px solid rgba(0,229,255,0.22);
  border-radius: 10px;
  color: var(--text-main);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-align: left;
  transition: var(--transition-fast);
  backdrop-filter: blur(4px);
  overflow: hidden;
  font-family: inherit;
}
.nav-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,229,255,0.1), transparent);
  opacity: 0;
  transition: var(--transition-fast);
}
.nav-btn:hover {
  border-color: var(--primary);
  box-shadow: 0 0 28px rgba(0,229,255,0.2), inset 0 0 28px rgba(0,229,255,0.08);
  transform: translateY(-3px);
  color: #fff;
}
.nav-btn:hover::before { opacity: 1; }
.nav-btn .btn-icon {
  display: inline-block;
  margin-right: 12px;
  font-size: 22px;
  vertical-align: middle;
}
.nav-btn .btn-text { position: relative; z-index: 1; }
.nav-btn .btn-arrow {
  position: absolute; right: 18px; top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--primary);
  opacity: 0.6;
  transition: var(--transition-fast);
}
.nav-btn:hover .btn-arrow { opacity: 1; transform: translateY(-50%) translateX(4px); }

/* ========== 按钮展开区域 ========== */
.btn-expand {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), margin 0.4s ease, opacity 0.4s ease;
  opacity: 0;
  margin-top: 0;
}
.btn-expand.open {
  max-height: 260px;
  opacity: 1;
  margin-top: 12px;
}
.sub-btns {
  display: flex; gap: 12px;
  padding: 6px 6px 6px 32px;
}
.sub-btn {
  flex: 1;
  padding: 14px 20px;
  border: 1px solid rgba(124,77,255,0.3);
  border-radius: 8px;
  background: rgba(124,77,255,0.08);
  color: var(--text-main);
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: var(--transition-fast);
  display: inline-flex;
  align-items: center; justify-content: center;
  gap: 8px;
  font-family: inherit;
  backdrop-filter: blur(4px);
}
.sub-btn:hover {
  background: rgba(124,77,255,0.18);
  border-color: var(--secondary);
  box-shadow: 0 0 20px rgba(124,77,255,0.25);
  color: #fff;
}
.sub-btn.style-blue { border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.06); }
.sub-btn.style-blue:hover { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
.sub-btn.style-pink { border-color: rgba(255,64,129,0.3); background: rgba(255,64,129,0.06); }
.sub-btn.style-pink:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,64,129,0.25); }
.sub-btn.style-green { border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.06); }
.sub-btn.style-green:hover { border-color: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.25); }
.sub-btn.style-orange { border-color: rgba(255,152,0,0.3); background: rgba(255,152,0,0.06); }
.sub-btn.style-orange:hover { border-color: #ff9800; box-shadow: 0 0 20px rgba(255,152,0,0.25); }
.sub-btn.style-purple { border-color: rgba(124,77,255,0.3); background: rgba(124,77,255,0.08); }
.sub-btn.style-purple:hover { border-color: var(--secondary); box-shadow: 0 0 20px rgba(124,77,255,0.25); }

/* ========== 翻页控制 ========== */
.page-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 28px;
  margin-top: 36px;
  position: relative; z-index: 1;
}
.page-btn {
  width: 56px; height: 56px;
  border: 1px solid rgba(0,229,255,0.3);
  background: rgba(0,229,255,0.08);
  border-radius: 50%;
  color: var(--primary);
  font-size: 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition-fast);
  backdrop-filter: blur(6px);
}
.page-btn:hover:not(:disabled) {
  background: rgba(0,229,255,0.18);
  box-shadow: 0 0 28px var(--primary-glow);
}
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-indicator {
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
.page-indicator .current { color: var(--primary); font-weight: bold; font-size: 19px; }

/* ========== 可视化配置编辑器（已移除） ========== */
/* 编辑器 DOM / CSS / JS 已彻底删除；以下为防御性规则，任何残留节点一律不显示 */
.settings-btn, .settings-overlay, .settings-panel, .bake-banner,
.page-tabs, .btn-edit-card, .cfg-section { display: none !important; }

/* ========== 目录页特殊样式 ========== */
.toc-page { text-align: center; }
.toc-page .chapter-title { font-size: 42px; }
.book-cover-icon { font-size: 64px; margin-bottom: 20px; }
.toc-preview {
  display: flex; flex-direction: column; gap: 14px;
  margin-top: 28px;
  position: relative; z-index: 1;
}
.toc-preview-item {
  padding: 16px 28px;
  background: rgba(0,229,255,0.04);
  border: 1px solid rgba(0,229,255,0.12);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 17px;
  display: flex; align-items: center; justify-content: space-between;
  transition: var(--transition-fast);
  cursor: pointer;
}
.toc-preview-item:hover {
  color: var(--primary);
  border-color: rgba(0,229,255,0.35);
  background: rgba(0,229,255,0.08);
}
.toc-preview-item .page-num {
  font-size: 14px;
  color: var(--text-dim);
  opacity: 0.6;
}

/* ========== 页面内容动画 ========== */
.page-content {
  position: relative; z-index: 1;
  animation: contentFadeIn 0.5s ease 0.2s both;
}
@keyframes contentFadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 页码 ========== */
.page-number {
  position: absolute;
  bottom: 20px;
  font-size: 13px;
  color: var(--text-dim);
  opacity: 0.4;
  letter-spacing: 1px;
}
.page-left .page-number { right: 24px; }
.page-right .page-number { left: 24px; }

/* ========== 装饰元素 ========== */
.corner-decoration {
  position: absolute;
  width: 40px; height: 40px;
  border-color: rgba(0,229,255,0.2);
  z-index: 2;
}
.corner-tl { top: 16px; left: 16px; border-top: 1px solid; border-left: 1px solid; }
.corner-tr { top: 16px; right: 16px; border-top: 1px solid; border-right: 1px solid; }
.corner-bl { bottom: 16px; left: 16px; border-bottom: 1px solid; border-left: 1px solid; }
.corner-br { bottom: 16px; right: 16px; border-bottom: 1px solid; border-right: 1px solid; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  :root { --sidebar-w: 260px; }
  .book-container { margin: 20px auto; }
  .page { padding: 32px 22px; }
  .chapter-title { font-size: 26px; }
  .btn-grid { grid-template-columns: 1fr; }
  .btn-grid .nav-btn:nth-child(even),
  .btn-grid .nav-btn:nth-child(odd) { transform: none; }
  .sidebar { width: 240px; }
  .page-controls { gap: 16px; }
  .page-btn { width: 46px; height: 46px; font-size: 18px; }
}
@media (max-width: 520px) {
  .book-spine { display: none; }
  .page-left, .page-right { border-radius: 10px; }
  .pages-wrapper { flex-direction: column; }
  .page { min-height: auto; }
  .sub-btns { flex-direction: column; padding-left: 16px; }
}

/* ========== 滚动条美化 ========== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,0.4); }

/* ========== 背景音乐播放器（四曲随机·循环） ========== */
.bgm-dock{position:fixed;left:32px;bottom:32px;z-index:300;display:flex;align-items:center;gap:12px}
.bgm-btn{width:60px;height:60px;flex-shrink:0;border:1px solid rgba(0,229,255,.3);background:rgba(10,14,30,.7);border-radius:50%;color:var(--primary);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition-fast);backdrop-filter:blur(10px);line-height:1;font-family:inherit}
.bgm-btn:hover{background:rgba(0,229,255,.14);box-shadow:0 0 32px var(--primary-glow)}
.bgm-btn.playing{border-color:var(--primary);background:rgba(0,229,255,.16);animation:bgmPulse 2s ease-in-out infinite}
@keyframes bgmPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.35)}50%{box-shadow:0 0 0 14px rgba(0,229,255,0)}}
.bgm-btn.loading{opacity:.55}
.bgm-btn.blocked{border-color:rgba(255,152,0,.5);color:#ffb74d;animation:bgmBlink 1.4s ease-in-out infinite}
@keyframes bgmBlink{0%,100%{opacity:1}50%{opacity:.45}}
.bgm-panel{background:rgba(10,14,30,.78);backdrop-filter:blur(14px);border:1px solid rgba(0,229,255,.22);border-radius:12px;padding:12px 16px;min-width:252px;opacity:0;transform:translateX(-10px);pointer-events:none;transition:var(--transition-fast)}
.bgm-dock:hover .bgm-panel,.bgm-panel:hover{opacity:1;transform:translateX(0);pointer-events:auto}
.bgm-name{font-size:13px;color:var(--text-main);letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;white-space:nowrap}
.bgm-name b{color:var(--primary);font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:152px}
.bgm-name .t{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums}
.bgm-pbar{height:4px;border-radius:2px;background:rgba(0,229,255,.14);cursor:pointer;overflow:hidden;margin-top:8px}
.bgm-pfill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#7c4dff);box-shadow:0 0 10px var(--primary-glow);transition:width .1s linear}
.bgm-ctrls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.bgm-ctrls button{border:1px solid rgba(0,229,255,.25);background:rgba(0,229,255,.06);color:var(--text-dim);border-radius:50%;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:var(--transition-fast);font-size:14px;font-family:inherit;line-height:1}
.bgm-ctrls button:hover{color:var(--primary);border-color:var(--primary)}
.bgm-ctrls button.on{color:var(--accent);border-color:rgba(255,64,129,.5);background:rgba(255,64,129,.1)}
.bgm-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.bgm-row input[type=range]{flex:1;accent-color:var(--primary);cursor:pointer}
.bgm-row .ico{font-size:14px;opacity:.7;flex-shrink:0}
.bgm-vol-val{font-size:12px;color:var(--primary);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.bgm-tip{font-size:11px;margin-top:8px;line-height:1.5;white-space:normal}
.bgm-tip.warn{color:#ffb74d}
.bgm-tip.err{color:var(--accent)}
.bgm-tip.ok{color:#00e676}
@media(max-width:768px){
  .bgm-dock{left:16px;bottom:16px}
  .bgm-btn{width:48px;height:48px;font-size:20px}
  .bgm-panel{min-width:200px;padding:10px 12px}
}

</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer" id="bgLayer" style="--bg-image: url('./bg.webp'); filter: none;"></div>
<div class="bg-overlay" style="background: linear-gradient(135deg, rgba(5, 8, 20, 0.133) 0%, rgba(10, 14, 30, 0.12) 50%, rgba(5, 8, 20, 0.133) 100%);"></div>
<div class="bg-grid"></div>

<!-- 背景音乐播放器：四曲随机 + 循环 + 可暂停 + 下一曲 -->
<div class="bgm-dock" id="bgmDock">

/* ============================================================
   ╔════════════════════════════════════════════════════════╗
   ║                     🔧 核心逻辑                        ║
   ╚════════════════════════════════════════════════════════╝
   ============================================================ */

let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let currentPageIndex = 0;
const STORAGE_KEY = 'bookNavConfig_baked_'+Date.now()+'';

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------- 初始化 ---------- */
function init() {
  loadLocalConfig();
  applyBackground();
  applyOpacity();
  renderSidebar();
  renderPage(0, 'right');
  updatePageIndicator();
}

/* ---------- 背景 ---------- */
function applyBackground() {
  const layer = document.getElementById('bgLayer');
  layer.style.setProperty('--bg-image', `url('${CONFIG.backgroundImage}')`);
  const blur = CONFIG.backgroundBlur || '0';
  layer.style.filter = blur !== '0' ? `blur(${blur}px)` : 'none';
}

/* ---------- 透明度控制（新增） ---------- */
function applyOpacity() {
  const pageOp = parseFloat(CONFIG.pageOpacity || '0.55');
  const overlayOp = parseFloat(CONFIG.overlayOpacity || '0.5');

  // 页面背景
  document.documentElement.style.setProperty('--page-bg', `rgba(15, 20, 40, ${pageOp})`);

  // 遮罩层
  const overlay = document.querySelector('.bg-overlay');
  if (overlay) {
    overlay.style.background = `linear-gradient(135deg,
      rgba(5,8,20,${overlayOp * 0.9}) 0%,
      rgba(10,14,30,${overlayOp * 0.8}) 50%,
      rgba(5,8,20,${overlayOp * 0.9}) 100%)`;
  }
}

/* ---------- 侧边栏 ---------- */
function renderSidebar() {
  const ul = document.getElementById('tocList');
  ul.innerHTML = '';
  CONFIG.chapters.forEach((ch, i) => {
    const li = document.createElement('li');
    li.className = 'toc-item';
    li.innerHTML = `
      <a class="toc-link" data-index="${i}" onclick="goToPage(${i})">
        <span class="toc-num">${i + 1}</span>
        <span>${ch.replace(/^[^\s]+ /, '')}</span>
      </a>`;
    ul.appendChild(li);
  });
  updateActiveToc();
}

function updateActiveToc() {
  document.querySelectorAll('.toc-link').forEach(link => {
    link.classList.toggle('active', parseInt(link.dataset.index) === currentPageIndex);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

/* ---------- 页面渲染 ---------- */
function renderPage(index, direction) {
  const pageData = CONFIG.pages[index];
  const chapterName = CONFIG.chapters[index] || `第 ${index + 1} 页`;
  const cleanTitle = chapterName.replace(/^[^\s]+ /, '');
  const isLeft = index % 2 === 0;
  const leftContent = document.getElementById('pageLeftContent');
  const rightContent = document.getElementById('pageRightContent');
  const leftNum = document.getElementById('pageLeftNum');
  const rightNum = document.getElementById('pageRightNum');

  const html = generatePageHTML(pageData, chapterName, cleanTitle, index);

  if (isLeft) {
    leftContent.innerHTML = html;
    rightContent.innerHTML = getNextPagePreview(index + 1);
    leftNum.textContent = `${index + 1}`;
    rightNum.textContent = index + 2 <= CONFIG.pages.length ? `${index + 2}` : '';
  } else {
    rightContent.innerHTML = html;
    leftContent.innerHTML = getPrevPagePreview(index - 1);
    rightNum.textContent = `${index + 1}`;
    leftNum.textContent = `${index}`;
  }

  const animPage = isLeft ? document.getElementById('pageLeft') : document.getElementById('pageRight');
  const animClass = direction === 'left' ? 'flipping-left' : 'flipping-right';
  animPage.classList.remove('flipping-left', 'flipping-right');
  void animPage.offsetWidth;
  animPage.classList.add(animClass);

  currentPageIndex = index;
  updatePageIndicator();
  updateActiveToc();
  bindButtonEvents();
}

function generatePageHTML(pageData, fullTitle, cleanTitle, index) {
  if (pageData.type === 'toc') {
    let items = '';
    CONFIG.chapters.forEach((ch, i) => {
      if (i === 0) return;
      items += `<div class="toc-preview-item" onclick="goToPage(${i})">
        <span>${ch}</span><span class="page-num">第 ${i + 1} 页</span>
      </div>`;
    });
    return `
      <div class="toc-page">
        <div class="book-cover-icon">📖</div>
        <h1 class="chapter-title">${cleanTitle}</h1>
        <div class="title-underline"></div>
        <p class="chapter-subtitle">${pageData.description || ''}</p>
        <div class="toc-preview">${items}</div>
      </div>`;
  }

  let buttonsHTML = '';
  (pageData.buttons || []).forEach((btn, bi) => {
    const subHTML = (btn.subButtons || []).map(sub => {
      const st = sub.style || 'purple';
      return `<a class="sub-btn style-${st}" href="${sub.url}" target="_blank" rel="noopener">
        ${sub.label}
      </a>`;
    }).join('');

    buttonsHTML += `
      <div style="margin-bottom:8px;">
        <button class="nav-btn" onclick="toggleExpand(this)" data-index="${bi}">
          <span class="btn-icon">${btn.icon || '🔹'}</span>
          <span class="btn-text">${btn.label}</span>
          <span class="btn-arrow">▼</span>
        </button>
        <div class="btn-expand">
          <div class="sub-btns">${subHTML}</div>
        </div>
      </div>`;
  });

  return `
    <h1 class="chapter-title">${cleanTitle}</h1>
    <div class="title-underline"></div>
    <p class="chapter-subtitle">${fullTitle}</p>
    <div class="btn-grid">${buttonsHTML}</div>
  `;
}

function getNextPagePreview(index) {
  if (index >= CONFIG.pages.length) return '<div style="opacity:0.2;text-align:center;padding:50px 0;font-size:16px;">— 全书完 —</div>';
  const ch = CONFIG.chapters[index] || '';
  return `<div style="opacity:0.35;text-align:center;padding:50px 24px;">
    <div style="font-size:15px;color:var(--text-dim);margin-bottom:10px;">下一页</div>
    <div style="font-size:22px;color:var(--primary);">${ch}</div>
  </div>`;
}

function getPrevPagePreview(index) {
  if (index < 0) return '<div style="opacity:0.2;text-align:center;padding:50px 0;font-size:16px;">— 封面 —</div>';
  const ch = CONFIG.chapters[index] || '';
  return `<div style="opacity:0.35;text-align:center;padding:50px 24px;">
    <div style="font-size:15px;color:var(--text-dim);margin-bottom:10px;">上一页</div>
    <div style="font-size:22px;color:var(--primary);">${ch}</div>
  </div>`;
}

/* ---------- 按钮展开/收起 ---------- */
function toggleExpand(btn) {
  const expand = btn.nextElementSibling;
  const isOpen = expand.classList.contains('open');
  btn.parentElement.parentElement.querySelectorAll('.btn-expand.open').forEach(el => {
    if (el !== expand) el.classList.remove('open');
  });
  btn.parentElement.parentElement.querySelectorAll('.nav-btn').forEach(b => {
    if (b !== btn) b.querySelector('.btn-arrow').textContent = '▼';
  });
  expand.classList.toggle('open', !isOpen);
  btn.querySelector('.btn-arrow').textContent = !isOpen ? '▲' : '▼';
}

function bindButtonEvents() {
  document.querySelectorAll('.nav-btn .btn-arrow').forEach(a => a.textContent = '▼');
}

/* ---------- 翻页控制 ---------- */
function goToPage(index) {
  if (index < 0 || index >= CONFIG.pages.length || index === currentPageIndex) return;
  const dir = index > currentPageIndex ? 'right' : 'left';
  renderPage(index, dir);
}

function nextPage() { goToPage(Math.min(currentPageIndex + 1, CONFIG.pages.length - 1)); }
function prevPage() { goToPage(Math.max(currentPageIndex - 1, 0)); }

function updatePageIndicator() {
  document.getElementById('currentPage').textContent = currentPageIndex + 1;
  document.getElementById('totalPages').textContent = CONFIG.pages.length;
  document.getElementById('prevBtn').disabled = currentPageIndex === 0;
  document.getElementById('nextBtn').disabled = currentPageIndex === CONFIG.pages.length - 1;
}

/* ---------- 触摸滑动翻页 ---------- */
let touchStartX = 0, touchEndX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 50) { diff > 0 ? nextPage() : prevPage(); }
}, {passive:true});

/* ---------- 键盘翻页 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
});


/* ---------- 本地存储 ---------- */
function saveLocalConfig() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)); }
  catch(e) { console.warn('保存失败', e); }
}

function loadLocalConfig() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const cfg = JSON.parse(saved);
      if (cfg.backgroundImage) CONFIG.backgroundImage = cfg.backgroundImage;
      if (cfg.backgroundBlur !== undefined) CONFIG.backgroundBlur = cfg.backgroundBlur;
      if (cfg.pageOpacity !== undefined) CONFIG.pageOpacity = cfg.pageOpacity;
      if (cfg.overlayOpacity !== undefined) CONFIG.overlayOpacity = cfg.overlayOpacity;
      if (cfg.chapters && cfg.chapters.length) CONFIG.chapters = cfg.chapters;
      if (cfg.pages && cfg.pages.length) CONFIG.pages = cfg.pages;
    }
  } catch(e) { console.warn('读取配置失败', e); }
}

/* ---------- 启动 ---------- */

// 支持 ?bake=1 自动静默固化下载
if(location.search.indexOf('bake=1')!==-1){window.addEventListener('load',function(){setTimeout(bakeHTML,600);});}
/* ===================================================================
   背景音乐：四首 OPUS，随机播放 + 循环 + 暂停 + 下一曲

   【路径说明】默认用相对路径，四个 .opus 文件与 index.html 放在
   仓库同一目录即可，本地双击 / GitHub Pages / jsDelivr 都能跑。
   如果音乐与网页不同目录，改下面的 BGM_BASE 即可，例如：
     var BGM_BASE = 'https://cdn.jsdelivr.net/gh/用户名/仓库名@main/';
   注意：GitHub 对文件名大小写敏感，DQaoa.opus 的 D 和 Q 必须大写。
   =================================================================== */
var BGM_BASE = '';
var BGM_LIST = [
  { name:'Bar Bar Bar', src: BGM_BASE + 'bar.opus'      },
  { name:'DQaoa',       src: BGM_BASE + 'DQaoa.opus'    },
  { name:'iloveit',     src: BGM_BASE + 'iloveit.opus'  },
  { name:'iminlove',    src: BGM_BASE + 'iminlove.opus' }
];

var bgmAudio, bgmBtn;
var bgmCur=0, bgmShuffle=true, bgmLoopOne=false, bgmFailed={};
var bgmOrder=[], bgmPos=0, bgmNeedGesture=false;

function bgmTip(m,c){ var t=document.getElementById('bgmTip'); if(t){t.textContent=m;t.className='bgm-tip'+(c?' '+c:'');} }

/* 洗牌：生成一轮随机顺序，四首都播完才重排，避免刚播过又播 */
function bgmBuildOrder(){
  bgmOrder=[];
  for(var i=0;i<BGM_LIST.length;i++) bgmOrder.push(i);
  for(var i=bgmOrder.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=bgmOrder[i]; bgmOrder[i]=bgmOrder[j]; bgmOrder[j]=t;
  }
  bgmPos=0;
}

function bgmLoad(idx){
  if(idx<0||idx>=BGM_LIST.length) return;
  bgmCur=idx;
  var t=BGM_LIST[idx];
  document.getElementById('bgmTitle').textContent='\ud83c\udfb5 '+t.name;
  document.getElementById('bgmBtn').classList.add('loading');
  bgmAudio.src=t.src;
  bgmAudio.load();
}

/* 尝试播放；被浏览器拦截则标记为「等待用户点击」 */
function bgmUnlock(){
  var p=bgmAudio.play();
  if(p&&p.then){
    p.then(function(){
      bgmNeedGesture=false;
      document.getElementById('bgmBtn').classList.remove('blocked');
      bgmTip('\u2705 \u6b63\u5728\u64ad\u653e\uff1a'+BGM_LIST[bgmCur].name,'ok');
    }).catch(function(){
      bgmNeedGesture=true;
      document.getElementById('bgmBtn').classList.add('blocked');
      bgmTip('\ud83d\udd07 \u6d4f\u89c8\u5668\u62e6\u622a\u4e86\u81ea\u52a8\u64ad\u653e\uff0c\u70b9\u51fb\u9875\u9762\u4efb\u610f\u5904\u5f00\u542f\u97f3\u4e50','warn');
    });
  }
}

function bgmToggle(){
  if(bgmNeedGesture){ bgmUnlock(); return; }
  if(!bgmAudio.src) bgmLoad(bgmOrder[bgmPos]!=null?bgmOrder[bgmPos]:0);
  if(bgmAudio.paused) bgmUnlock(); else bgmAudio.pause();
}

function bgmNext(forcePlay){
  var n;
  if(bgmShuffle){
    bgmPos++;
    if(bgmPos>=bgmOrder.length) bgmBuildOrder();   /* 一轮播完重新洗牌，无限循环 */
    n=bgmOrder[bgmPos];
  } else { n=(bgmCur+1)%BGM_LIST.length; }
  /* forcePlay：用于「一曲播完自然结束」场景，此时 paused 已变 true，
     必须强制连播，否则下一首只会加载而不播放 */
  var shouldPlay = forcePlay || !bgmAudio.paused || bgmNeedGesture;
  bgmLoad(n);
  if(shouldPlay) setTimeout(bgmUnlock,120);
}

function bgmPrev(){
  var n;
  if(bgmShuffle){
    bgmPos--;
    if(bgmPos<0) bgmPos=bgmOrder.length-1;
    n=bgmOrder[bgmPos];
  } else { n=(bgmCur-1+BGM_LIST.length)%BGM_LIST.length; }
  var wasPlaying = !bgmAudio.paused || bgmNeedGesture;
  bgmLoad(n);
  if(wasPlaying) setTimeout(bgmUnlock,120);
}

function bgmToggleShuffle(){
  bgmShuffle=!bgmShuffle;
  document.getElementById('bgmShuf').classList.toggle('on',bgmShuffle);
  if(bgmShuffle){ bgmBuildOrder(); bgmTip('\u2705 \u968f\u673a\u64ad\u653e\u5df2\u5f00\u542f','ok'); }
  else bgmTip('\u987a\u5e8f\u64ad\u653e','ok');
}

function bgmToggleLoop(){
  bgmLoopOne=!bgmLoopOne;
  bgmAudio.loop=bgmLoopOne;
  document.getElementById('bgmLoop').classList.toggle('on',bgmLoopOne);
  bgmTip(bgmLoopOne?'\ud83d\udd01 \u5355\u66f2\u5faa\u73af\u5df2\u5f00\u542f':'\u5217\u8868\u5faa\u73af','ok');
}

function bgmSetVol(v){
  bgmAudio.volume=parseFloat(v);
  document.getElementById('bgmVolVal').textContent=Math.round(v*100)+'%';
  try{ localStorage.setItem('bgmVol', v); }catch(e){}
}

function bgmFmt(s){
  s=Math.floor(s||0); if(!isFinite(s)||s<0)s=0;
  return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}

function initBgm(){
  bgmAudio=document.getElementById('bgmAudio');
  bgmBtn=document.getElementById('bgmBtn');
  if(!bgmAudio) return;

  var sv=null;
  try{ sv=localStorage.getItem('bgmVol'); }catch(e){}
  if(sv!==null) document.getElementById('bgmVol').value=sv;
  bgmAudio.volume=parseFloat(document.getElementById('bgmVol').value);
  document.getElementById('bgmVolVal').textContent=Math.round(bgmAudio.volume*100)+'%';

  bgmAudio.addEventListener('timeupdate',function(){
    if(bgmAudio.duration) document.getElementById('bgmFill').style.width=(bgmAudio.currentTime/bgmAudio.duration*100)+'%';
    document.getElementById('bgmTime').textContent=bgmFmt(bgmAudio.currentTime)+' / '+bgmFmt(bgmAudio.duration);
  });
  bgmAudio.addEventListener('loadedmetadata',function(){
    bgmBtn.classList.remove('loading');
    document.getElementById('bgmTime').textContent=bgmFmt(bgmAudio.currentTime)+' / '+bgmFmt(bgmAudio.duration);
  });
  bgmAudio.addEventListener('canplay',function(){ bgmBtn.classList.remove('loading'); });
  bgmAudio.addEventListener('play',function(){
    bgmBtn.classList.add('playing'); bgmBtn.textContent='\u275a\u275a';
  });
  bgmAudio.addEventListener('pause',function(){
    bgmBtn.classList.remove('playing'); bgmBtn.textContent='\u25b6';
  });
  /* 一首放完：单曲循环时 audio 的 loop 属性自己接管，否则切下一首，实现无限循环 */
  bgmAudio.addEventListener('ended',function(){ if(!bgmLoopOne) bgmNext(true); });
  bgmAudio.addEventListener('error',function(){
    bgmFailed[bgmCur]=true;
    var allDead=true;
    for(var i=0;i<BGM_LIST.length;i++) if(!bgmFailed[i]) allDead=false;
    bgmBtn.classList.remove('loading');
    if(allDead){
      bgmTip('\u274c \u56db\u4e2a\u6587\u4ef6\u90fd\u672a\u627e\u5230\uff0c\u68c0\u67e5\u6587\u4ef6\u540d\u5927\u5c0f\u5199\u4e0e\u8def\u5f84','err');
    } else {
      bgmTip('\u26a0\ufe0f \u300a'+BGM_LIST[bgmCur].name+'\u300b\u52a0\u8f7d\u5931\u8d25\uff0c\u81ea\u52a8\u8df3\u4e0b\u4e00\u9996','warn');
      setTimeout(bgmNext,700);
    }
  });

  document.getElementById('bgmBar').addEventListener('click',function(e){
    if(!bgmAudio.duration) return;
    var r=this.getBoundingClientRect();
    bgmAudio.currentTime=(e.clientX-r.left)/r.width*bgmAudio.duration;
  });

  /* 自动播放被拦截时，用户点击页面任意处即可开启（点播放器本身除外，交给按钮处理） */
  document.addEventListener('click',function(e){
    if(!bgmNeedGesture) return;
    if(e.target&&e.target.closest&&e.target.closest('.bgm-dock')) return;
    bgmUnlock();
  },true);
  document.addEventListener('keydown',function(e){
    if(!bgmNeedGesture) return;
    if(e.target&&e.target.closest&&e.target.closest('.bgm-dock')) return;
    bgmUnlock();
  },true);
  document.addEventListener('touchstart',function(e){
    if(!bgmNeedGesture) return;
    if(e.target&&e.target.closest&&e.target.closest('.bgm-dock')) return;
    bgmUnlock();
  },true);

  /* 随机挑一首作为开场，然后自动播放 */
  bgmBuildOrder();
  bgmLoad(bgmOrder[0]);
  bgmUnlock();
}

init(); initBgm();
</script>
